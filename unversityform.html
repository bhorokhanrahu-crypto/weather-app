<!DOCTYPE html>
<html>
<head>
    <title>BBSUTSD Admission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }
        .form-container {
            background-color: white;
            width: 700px;
            margin: auto;
            padding: 20px;
            border: 2px solid #004080;
            border-radius: 10px;
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #004080;
            padding-bottom: 10px;
        }
        .header h1 {
            color: #004080;
            margin: 5px 0;
        }
        .header h2 {
            color: #0066cc;
            margin: 5px 0;
            font-size: 18px;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .row {
            display: flex;
            gap: 20px;
        }
        .row .form-group {
            width: 50%;
        }
        .submit-btn {
            background-color: #004080;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>BENAZIR BHUTTO SHAHEED UNIVERSITY</h1>
            <h2>BBSUTSD - Khairpur Mirs, Sindh</h2>
            <h3>ADMISSION FORM 2026</h3>
        </div>

        <form>
            <div class="row">
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Father Name:</label>
                    <input type="text" name="fname" placeholder="Enter father name" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>CNIC / B-Form:</label>
                    <input type="text" name="cnic" placeholder="xxxxx-xxxxxxx-x" required>
                </div>
                <div class="form-group">
                    <label>Date of Birth:</label>
                    <input type="date" name="dob" required>
                </div>
            </div>

            <div class="form-group">
                <label>Address:</label>
                <input type="text" name="address" placeholder="Enter full address" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="phone" placeholder="03xx-xxxxxxx" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" placeholder="example@gmail.com" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Department:</label>
                    <select name="department" required>
                        <option value="">Select Department</option>
                        <option>Computer Science</option>
                        <option>Software Engineering</option>
                        <option>Information Technology</option>
                        <option>Business Administration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Program:</label>
                    <select name="program" required>
                        <option value="">Select Program</option>
                        <option>BS</option>
                        <option>MS</option>
                        <option>PhD</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Last Qualification:</label>
                <input type="text" name="qualification" placeholder="e.g. Intermediate / DAE" required>
            </div>

            <button type="submit" class="submit-btn">Submit Admission Form</button>
        </form>
    </div>
</body>
</html>
